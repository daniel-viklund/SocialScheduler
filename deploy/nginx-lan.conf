server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Match the actual connection address, never a client-supplied header.
    allow 192.168.0.0/24;
    deny all;

    # The app enforces MAX_UPLOAD_GB. Stream large uploads without a second
    # temporary copy or nginx's default 1 MB request limit.
    client_max_body_size 0;
    client_body_timeout 3600s;

    # Resolve again after Compose recreates the app with a different IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $scheduler http://app:3000;

    location / {
        proxy_pass $scheduler;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
